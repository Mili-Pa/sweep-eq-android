name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret $v (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode signing key
        run: |
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/sweepeq.keystore

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SweepEQ-v${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SweepEQ-v${{ steps.v.outputs.version }}
          path: SweepEQ-v${{ steps.v.outputs.version }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the VERSION file to publish a new release."
          else
            gh release create "$TAG" "SweepEQ-$TAG.apk" --target "$GITHUB_SHA" --title "Sweep EQ $TAG" --generate-notes
          fi
